# Idle Factory Workflow Add Or Update Market Feature

## Action

Follow the add-or-update-market-feature workflow:
1. Modify or create command handler in apps/bot/src/commands/game/market.ts
2. Update or add interaction handlers in apps/bot/src/interaction-handlers/buttons/, modals/, or selects/ related to market
3. Update locale files for i18n in apps/bot/src/locales/en-US/game.json and apps/bot/src/locales/ko/game.json
4. Modify or add service logic in apps/bot/src/services/market.ts or related service files
5. Update or add utility files in apps/bot/src/utils/ if needed
6. Write or update integration tests in apps/bot/tests/integration/ or related test files

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: apps/bot/src/commands/game/market.ts, apps/bot/src/interaction-handlers/buttons/market*.ts, apps/bot/src/interaction-handlers/modals/market*.ts

