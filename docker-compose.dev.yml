services:
  postgres:
    image: postgres:16-alpine
    container_name: idle-factory-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: idle
      POSTGRES_PASSWORD: idle
      POSTGRES_DB: idle-factory-dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idle -d idle-factory-dev']
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: idle-factory-redis-dev
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
