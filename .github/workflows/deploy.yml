name: Deploy

# 배포는 stable 병합으로 자동 실행된다. 수동 재배포는 workflow_dispatch.
# 롤백은 이 워크플로가 아니라 VPS 의 .env.prod 에서 IMAGE_TAG 를 이전 SHA 로
# 되돌리고 compose up 을 다시 하는 절차다 — docs/ops/deployment.md 참고.
on:
  push:
    branches:
      - stable
  workflow_dispatch:

concurrency:
  # 배포는 겹치면 안 된다. 진행 중인 배포를 취소하면 마이그레이션이 반쯤
  # 적용된 상태로 남을 수 있으므로 cancel-in-progress 를 끈다.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve image coordinates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      registry: ${{ steps.meta.outputs.registry }}
      matrix: ${{ steps.meta.outputs.matrix }}
      runner: ${{ steps.meta.outputs.runner }}
      platform: ${{ steps.meta.outputs.platform }}
    steps:
      - name: Compute tag, registry path, image set and target arch
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          # 리포지터리 Variables 에 WEB_ON_VERCEL=true 를 두면 web 을 Vercel 이
          # 담당하는 것으로 보고 여기서는 이미지를 만들지 않는다.
          WEB_ON_VERCEL: ${{ vars.WEB_ON_VERCEL }}
          # 배포 대상 VPS 의 CPU 아키텍처. VPS 에서 `uname -m` 으로 확인한다:
          #   x86_64 → amd64 (기본) / aarch64 → arm64
          # 값을 틀리면 VPS 에서 `no matching manifest for linux/...` 로 pull 이
          # 실패한다. 아래 deploy 잡이 그 불일치를 배포 전에 잡아 알려준다.
          DEPLOY_ARCH: ${{ vars.DEPLOY_ARCH }}
        run: |
          set -euo pipefail

          # 아키텍처마다 네이티브 러너를 골라 QEMU 에뮬레이션을 피한다.
          # 에뮬레이션으로 arm64 를 빌드하면 pnpm install 과 next build 가
          # 수 배로 느려진다.
          case "${DEPLOY_ARCH:-amd64}" in
            amd64) runner='ubuntu-latest'    ; platform='linux/amd64' ;;
            arm64) runner='ubuntu-24.04-arm' ; platform='linux/arm64' ;;
            *)
              echo "::error::DEPLOY_ARCH 는 amd64 또는 arm64 여야 한다 (현재: ${DEPLOY_ARCH})"
              exit 1
              ;;
          esac
          # GHCR 경로는 소문자만 허용한다. 오너에 대문자가 있으면 pull 이 깨진다.
          registry="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          short="$(printf '%s' "$SHA" | cut -c1-7)"
          # 프리뷰 브랜치 산출물은 태그로 구분해 stable 의 sha-* 와 섞이지 않게 한다.
          if [ "$REF" = 'refs/heads/stable' ]; then
            tag="sha-${short}"
          else
            tag="preview-${short}"
          fi

          bot='{"image":"bot","dockerfile":"apps/bot/Dockerfile"}'
          web='{"image":"web","dockerfile":"apps/web/Dockerfile"}'
          migrator='{"image":"migrator","dockerfile":"packages/database/Dockerfile"}'
          if [ "${WEB_ON_VERCEL:-}" = 'true' ]; then
            matrix="{\"include\":[${bot},${migrator}]}"
            echo "web 이미지 생략 — Vercel 이 web 을 배포한다" >> "$GITHUB_STEP_SUMMARY"
          else
            matrix="{\"include\":[${bot},${web},${migrator}]}"
          fi

          echo "registry=${registry}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "runner=${runner}" >> "$GITHUB_OUTPUT"
          echo "platform=${platform}" >> "$GITHUB_OUTPUT"
          echo "이미지 태그: ${tag} (레지스트리: ${registry})" >> "$GITHUB_STEP_SUMMARY"
          echo "대상 아키텍처: ${platform} (러너: ${runner})" >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Build & push ${{ matrix.image }}
    needs: [prepare]
    # 대상 아키텍처의 네이티브 러너에서 빌드한다(DEPLOY_ARCH 로 결정).
    runs-on: ${{ needs.prepare.outputs.runner }}
    permissions:
      contents: read
      # GHCR 푸시에 필요. 기본 GITHUB_TOKEN 으로 충분하며 PAT 는 필요 없다.
      packages: write
    strategy:
      fail-fast: false
      # prepare 가 계산한다 — WEB_ON_VERCEL 이면 web 이 빠진다.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # 세 Dockerfile 모두 컨테이너 안에서 turbo prune 을 실행하므로
          # 컨텍스트는 반드시 레포 루트다.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # 러너와 같은 아키텍처라 에뮬레이션 없이 빌드된다. 명시해 두는 이유는
          # 산출 매니페스트의 플랫폼을 의도대로 못 박기 위해서다.
          platforms: ${{ needs.prepare.outputs.platform }}
          # sha-*(불변) 과 latest(이동) 를 함께 올린다. compose 는 불변 태그를
          # 참조하므로 롤백이 .env.prod 한 줄 수정으로 끝난다.
          tags: |
            ${{ needs.prepare.outputs.registry }}/idle-factory-${{ matrix.image }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/idle-factory-${{ matrix.image }}:latest
          build-args: |
            BUILD_NUMBER=${{ needs.prepare.outputs.tag }}
          # 캐시 스코프에 아키텍처를 넣는다. 넣지 않으면 amd64 와 arm64 레이어가
          # 같은 스코프를 공유해 서로를 무효화한다.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ vars.DEPLOY_ARCH || 'amd64' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ vars.DEPLOY_ARCH || 'amd64' }}

  deploy:
    name: Deploy to VPS
    needs: [prepare, build-push]
    # 프리뷰 브랜치 실행은 GHCR 푸시까지만 검증하고 여기서 멈춘다.
    if: github.ref == 'refs/heads/stable' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # compose.prod.yml 을 읽어 VPS 쪽 사본과 대조하기 위해 체크아웃한다.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify deploy secrets are present
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "${VPS_HOST:-}" ] || missing="${missing} VPS_HOST"
          [ -n "${VPS_USER:-}" ] || missing="${missing} VPS_USER"
          [ -n "${VPS_SSH_KEY:-}" ] || missing="${missing} VPS_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::배포 시크릿 누락:${missing} — 리포지터리 Settings → Secrets 에 등록할 것."
            exit 1
          fi

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          # 선택. 없으면 ssh-keyscan 결과를 그대로 신뢰한다(TOFU).
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/idle-factory' }}
          IMAGE_TAG: ${{ needs.prepare.outputs.tag }}
          WEB_ON_VERCEL: ${{ vars.WEB_ON_VERCEL }}
          BUILD_PLATFORM: ${{ needs.prepare.outputs.platform }}
        run: |
          set -euo pipefail

          # 이 워크플로는 이미지만 갱신한다. compose.prod.yml 이나 백업 스크립트가
          # 바뀌었는데 VPS 쪽을 갱신하지 않으면 구식 정의로 계속 배포된다.
          # 해시를 넘겨 원격에서 대조하게 한다.
          COMPOSE_SHA="$(sha256sum compose.prod.yml | cut -d' ' -f1)"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${VPS_SSH_HOST_KEY:-}" ]; then
            printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_SSH_HOST_KEY 미설정 — 호스트 키를 검증 없이 신뢰합니다(MITM 위험). \`ssh-keyscan <host>\` 결과를 시크릿으로 등록하는 것을 권장합니다."
            ssh-keyscan -H "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "IMAGE_TAG='${IMAGE_TAG}' DEPLOY_DIR='${DEPLOY_DIR}' COMPOSE_SHA='${COMPOSE_SHA}' WEB_ON_VERCEL='${WEB_ON_VERCEL:-}' BUILD_PLATFORM='${BUILD_PLATFORM}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_DIR" || { echo "배포 디렉터리 없음: $DEPLOY_DIR"; exit 1; }
          [ -f compose.prod.yml ] || { echo "compose.prod.yml 없음 — scripts/vps-sync.sh 로 설치할 것"; exit 1; }
          [ -f .env.prod ] || { echo ".env.prod 없음 — .env.prod.example 을 복사해 채울 것"; exit 1; }

          # compose 정의 드리프트 감지. 배포를 막지는 않는다(의도적 로컬 수정일
          # 수도 있으므로). 다만 조용히 넘어가면 새 서비스나 새 필수 env 가
          # 반영되지 않은 채 배포가 성공한 것처럼 보인다.
          remote_compose_sha="$(sha256sum compose.prod.yml | cut -d' ' -f1)"
          if [ "$remote_compose_sha" != "$COMPOSE_SHA" ]; then
            echo "::warning::VPS 의 compose.prod.yml 이 레포와 다르다. \`./scripts/vps-sync.sh\` 로 갱신할 것 (레포 ${COMPOSE_SHA:0:12} / VPS ${remote_compose_sha:0:12})."
          fi

          # 배포할 이미지 태그를 못 박는다. 이 파일이 지금 무엇이 돌고 있는지에
          # 대한 단일 기록이 되고, 롤백은 이 줄을 되돌리는 것으로 끝난다.
          if grep -q '^IMAGE_TAG=' .env.prod; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env.prod
          else
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env.prod
          fi

          compose() { docker compose --env-file .env.prod -f compose.prod.yml "$@"; }

          # 빌드한 이미지와 이 호스트의 CPU 아키텍처가 맞는지 먼저 본다. 어긋난 채
          # pull 하면 compose 가 "no matching manifest for linux/..." 만 뱉는데,
          # 그 메시지로는 원인이 아키텍처 불일치라는 것도, 어디를 고쳐야 하는지도
          # 알기 어렵다. 게다가 compose 는 병렬 pull 중 하나가 깨지면 멀쩡한
          # 서비스에까지 같은 에러를 붙여 원인을 더 흐린다.
          case "$(uname -m)" in
            x86_64)        host_platform='linux/amd64' ;;
            aarch64|arm64) host_platform='linux/arm64' ;;
            *)             host_platform="linux/$(uname -m)" ;;
          esac
          if [ "$host_platform" != "$BUILD_PLATFORM" ]; then
            echo "아키텍처 불일치 — 이미지: ${BUILD_PLATFORM} / 이 호스트: ${host_platform} ($(uname -m))"
            echo "리포지터리 Settings → Secrets and variables → Actions → Variables 에서"
            echo "DEPLOY_ARCH 를 '${host_platform#linux/}' 로 설정하고 다시 배포할 것."
            exit 1
          fi
          echo "아키텍처 확인: ${host_platform}"

          echo "── 이미지 pull (${IMAGE_TAG})"
          # GHCR 패키지가 private 이면 여기서 denied 가 난다. 패키지 가시성을
          # public 으로 바꾸거나 VPS 에서 `docker login ghcr.io` 를 1회 수행할 것.
          compose pull

          echo "── 기동 (migrator 완료를 기다린 뒤 bot·web 시작)"
          # migrator 가 실패하면 compose up 자체가 비-0 으로 끝난다. set -e 로 여기서
          # 죽으면 아래 진단이 실행되지 않아, 워크플로 로그에는
          # "didn't complete successfully: exit 1" 만 남고 정작 원인은 사라진다.
          # 종료 코드를 받아 두고 진단까지 마친 뒤에 실패시킨다.
          up_status=0
          compose up -d --remove-orphans || up_status=$?

          echo "── 마이그레이션 결과 확인"
          mig_cid="$(compose ps -aq migrator || true)"
          if [ -z "$mig_cid" ]; then
            echo "migrator 컨테이너를 찾을 수 없다 — 전체 상태:"
            compose ps -a || true
            exit 1
          fi
          mig_code="$(docker inspect -f '{{.State.ExitCode}}' "$mig_cid")"
          if [ "$mig_code" != '0' ]; then
            echo "migrator 실패 (exit ${mig_code}) — 로그:"
            docker logs "$mig_cid" 2>&1 | tail -50
            echo "── 참고: migrator 가 보는 DATABASE_URL 의 호스트"
            # 값 전체를 찍으면 비밀번호가 로그에 남는다. 호스트:포트만 뽑는다.
            docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$mig_cid" \
              | sed -n 's|^DATABASE_URL=.*@\([^/]*\)/.*|  접속 대상: \1|p' || true
            echo "  compose 내부에서는 'postgres:5432' 여야 한다. 호스트의 공인 IP 나"
            echo "  localhost 를 가리키면 컨테이너에서 닿지 않아 여기서 실패한다."
            exit 1
          fi
          echo "migrator OK"

          # migrator 는 성공했는데 up 이 실패했다면 다른 서비스 문제다.
          if [ "$up_status" != '0' ]; then
            echo "compose up 이 실패했다 (exit ${up_status}) — 전체 상태:"
            compose ps -a || true
            exit 1
          fi

          echo "── web healthcheck 대기"
          web_cid="$(compose ps -q web || true)"
          if [ -z "$web_cid" ]; then
            # web 이 없는 두 가지 경우를 구분한다. Vercel 로 옮긴 것이라면 정상이고,
            # 그게 아니라면 .env.prod 의 COMPOSE_PROFILES 에서 self-hosted 가
            # 빠져 web 이 조용히 사라진 설정 사고다. 후자를 성공으로 넘기면
            # 웹이 죽은 채로 배포가 초록불이 된다.
            if [ "${WEB_ON_VERCEL:-}" = 'true' ]; then
              echo "web 서비스 없음 — Vercel 이 web 을 배포하므로 건너뛴다"
            else
              echo "web 서비스가 뜨지 않았다. .env.prod 의 COMPOSE_PROFILES 에"
              echo "self-hosted 가 들어 있는지 확인할 것(비어 있으면 web 이 제외된다)."
              echo "web 을 Vercel 로 옮긴 것이라면 리포지터리 Variables 에"
              echo "WEB_ON_VERCEL=true 를 설정해야 한다."
              exit 1
            fi
          else
            ok=0
            for _ in $(seq 1 36); do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$web_cid")"
              if [ "$status" = 'healthy' ]; then ok=1; break; fi
              if [ "$status" = 'none' ]; then echo "web 이미지에 healthcheck 가 없다"; ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != '1' ]; then
              echo "web 이 180초 안에 healthy 가 되지 않았다 — 로그:"
              docker logs "$web_cid" 2>&1 | tail -50
              exit 1
            fi
            echo "web OK"
          fi

          # 봇은 HTTP 서버가 없어 healthcheck 를 걸 수 없다. 대신 잠깐 지켜본 뒤
          # 살아 있는지와 재시작 루프에 빠지지 않았는지를 본다.
          echo "── bot 로그인 확인"
          bot_cid="$(compose ps -q bot || true)"
          if [ -z "$bot_cid" ]; then
            echo "bot 컨테이너를 찾을 수 없다 — 전체 상태:"
            compose ps -a || true
            exit 1
          fi

          # 프로세스가 살아 있는 것만으로는 부족하다. 게이트웨이 연결에 실패해도
          # discord.js 는 조용히 재시도하므로 컨테이너는 그대로 Running 이고
          # 재시작 카운트도 0 이다 — 봇이 아무 명령에도 응답하지 않는 상태가
          # 배포 성공으로 보고된다(실제로 겪음).
          # ready 리스너(src/listeners/ready.ts)가 남기는 로그를 기다려
          # 로그인까지 확인한다. 문구를 바꾸면 여기도 함께 고칠 것.
          logged_in=0
          for _ in $(seq 1 24); do
            if docker logs "$bot_cid" 2>&1 | grep -q 'Logged in as'; then
              logged_in=1
              break
            fi
            running="$(docker inspect -f '{{.State.Running}}' "$bot_cid")"
            if [ "$running" != 'true' ]; then
              echo "bot 이 실행 중이 아니다 — 로그:"
              docker logs "$bot_cid" 2>&1 | tail -50
              exit 1
            fi
            sleep 5
          done

          restarts="$(docker inspect -f '{{.RestartCount}}' "$bot_cid")"
          if [ "$restarts" != '0' ]; then
            echo "bot 이 ${restarts}회 재시작했다(크래시 루프 의심) — 로그:"
            docker logs "$bot_cid" 2>&1 | tail -50
            exit 1
          fi

          if [ "$logged_in" != '1' ]; then
            echo "bot 이 120초 안에 Discord 로그인을 마치지 못했다 — 로그:"
            docker logs "$bot_cid" 2>&1 | tail -50
            echo "── 컨테이너에서 Discord API 에 닿는지 확인"
            docker exec "$bot_cid" node -e \
              "fetch('https://discord.com/api/v10/gateway').then(r=>r.json()).then(d=>console.log('  게이트웨이 응답:',JSON.stringify(d))).catch(e=>console.error('  실패:',e.message))" \
              2>&1 || echo "  (확인 명령 자체가 실패했다)"
            echo "  위가 실패하면 컨테이너 아웃바운드(DNS·방화벽) 문제,"
            echo "  성공하는데 로그인이 안 되면 BOT_TOKEN 또는 인텐트 설정을 볼 것."
            exit 1
          fi
          echo "bot OK (로그인 완료, 재시작 0회)"

          echo "── 배포 완료: ${IMAGE_TAG}"
          compose ps
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
