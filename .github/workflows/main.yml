name: CI

on:
  push:
    branches: [stable, main, 'refactor/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Prisma generate runs in the build DAG; provide a dummy URL so the
      # generator never tries to reach a real database during CI.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      HUSKY: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Lint (ESLint + Prettier check)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      HUSKY: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Build
        run: pnpm build --summarize

      - name: Summarize Turborepo output
        uses: ./.github/actions/turboSummary
