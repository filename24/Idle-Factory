name: CI

on:
  push:
    branches: [stable, main, 'refactor/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stable' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Remote cache credentials (used by every job that runs `turbo run`).
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
  # Cleaner interleaved logs in CI.
  TURBO_LOG_ORDER: grouped
  # Prisma generate runs in the build DAG; provide a dummy URL so the
  # generator never tries to reach a real database during CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  HUSKY: '0'

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Minimum depth so `turbo run --affected` can locate the merge base.
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Lint (ESLint + Prettier check)
        run: pnpm exec turbo run lint ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Type check
        run: pnpm exec turbo run typecheck ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  prisma:
    name: Prisma schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Validate Prisma schema
        run: pnpm --filter @idle/database run db:validate

      - name: Check schema is formatted
        run: |
          pnpm --filter @idle/database exec prisma format
          git diff --exit-code -- packages/database/prisma/schema.prisma \
            || (echo "::error::schema.prisma is not formatted. Run 'pnpm --filter @idle/database db:format' locally." && exit 1)

  test:
    name: Test (unit)
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      # Integration tests run in the dedicated `test-integration` job below,
      # which spins up a live Postgres. This job stays DB-free for speed.
      - name: Run unit tests
        run: pnpm exec turbo run test:unit ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      # game-core is the single source of truth for money and production
      # formulas, so it carries its own 80% coverage gate (issue #21). It has no
      # DB dependency, which is why the gate lives in this DB-free job rather
      # than alongside the bot's services gate below. Not `--affected`: the
      # threshold must hold on every PR, not only when the package is touched.
      - name: Run game-core coverage gate
        run: pnpm exec turbo run test:coverage --filter=@idle/game-core

      - name: Upload game-core coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-core-coverage
          path: packages/game-core/coverage
          if-no-files-found: ignore
          retention-days: 14

  test-integration:
    name: Test (integration + services coverage)
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    # Live Postgres for the bot's money-path integration suite. Named
    # `*-dev` so tests/integration/setup.ts (which refuses any non-dev DB)
    # is satisfied.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idle
          POSTGRES_PASSWORD: idle
          POSTGRES_DB: idle-factory-dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idle -d idle-factory-dev"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      # Job-level override of the dummy global URL. Must target a *-dev
      # database or the integration setup throws on startup.
      DATABASE_URL: postgresql://idle:idle@localhost:5432/idle-factory-dev?schema=public
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Apply database migrations
        run: pnpm --filter @idle/database run db:migrate:deploy

      # Release checklist (issue #21): catch a schema change that never got a
      # migration. The live DB has just been brought up to the latest migration,
      # so diffing it against schema.prisma must yield an empty patch —
      # `--exit-code` returns 2 when a difference exists. Without this a
      # schema-only edit passes CI and then breaks `migrate deploy` in
      # production, where there is no `db push` escape hatch.
      - name: Check for missing migrations (schema drift)
        run: |
          pnpm --filter @idle/database exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code \
          || (echo "::error::schema.prisma differs from the migrated database. Run 'pnpm --filter @idle/database db:migrate:dev' and commit the migration." && exit 1)

      # cache:false on the turbo task guarantees the live-DB suite never gets
      # skipped by a cache hit. `^build` + db:generate build @idle/database and
      # @idle/game-core (and the Prisma client) before the bot suite runs.
      - name: Run integration tests with services coverage gate
        run: pnpm exec turbo run test:coverage --filter=bot ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-coverage
          path: apps/bot/coverage
          if-no-files-found: ignore
          retention-days: 14

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so commitlint can walk the PR's commit range.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Validate commits in PR
        run: |
          pnpm exec commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: Build
        run: pnpm exec turbo run build --summarize ${{ github.event_name == 'pull_request' && '--affected' || '' }}

      - name: Summarize Turborepo output
        uses: ./.github/actions/turboSummary
