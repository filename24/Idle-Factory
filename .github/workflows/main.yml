name: Build and type check
on: [push, pull_request]

jobs:
  notify:
    name: Cache conflict error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge Conflict finder
        uses: InfiniteTeam/action-conflict-finder@master

  lint:
    name: ESLint style check
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Install Node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: 🏃‍♂️ Run ESLint
        run: pnpm format

      - name: 📦 Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'style(eslint): fixed eslint style format'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      BOT_TOKEN: ci-placeholder
    steps:
      - name: 🧹 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Install Node v22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          cwd: '.'
          enable-corepack: false

      - name: 💾  Build packages
        run: pnpm build:packages --summarize

      - name: 📝 Summarize Turborepo Output
        uses: ./.github/actions/turboSummary

      - name: 💾 Build apps
        run: pnpm build:apps --summarize

      - name: 📝 Summarize Turborepo Output
        uses: ./.github/actions/turboSummary
