# Idle Factory — 프로덕션 compose (단일 VPS)
#
# 실행:
#   docker compose --env-file .env.prod -f compose.prod.yml up -d
#
# `--env-file` 을 빠뜨리면 compose 는 `.env` 를 찾고, 없으면 모든 변수가 빈
# 문자열로 보간돼 이미지 태그가 `:` 로 끝나는 잘못된 참조가 된다.
# 운영 절차 전체는 docs/ops/deployment.md 를 볼 것.
#
# 설계 결정:
#  - Postgres 를 컨테이너로 유지한다. 데이터는 명명 볼륨에 남는다.
#  - 리버스 프록시·TLS 는 이 파일 밖(호스트의 기존 프록시)에서 담당한다.
#    따라서 web 은 127.0.0.1 에만 바인딩해 외부에 직접 노출되지 않는다.
#  - 자격증명은 서비스별로 필요한 것만 주입한다(env_file 통째 주입 금지).
#    web 컨테이너가 BOT_TOKEN 을 볼 이유가 없다.

# 프로젝트명을 명시적으로 dev 와 분리한다. compose 는 프로젝트명을 지정하지
# 않으면 디렉터리명에서 유도하므로, 레포가 `Idle-Factory` 에 클론된 호스트에서는
# docker-compose.dev.yml 의 프로젝트명이 `idle-factory` 가 된다. 여기에 같은
# 이름을 쓰면 prod 스택을 올리는 순간 compose 가 dev 컨테이너를 같은 프로젝트로
# 간주해 prod 정의로 재생성해 버린다(실제로 겪은 사고).
name: idle-factory-prod

# 세 앱 이미지가 공유하는 로깅 설정. 이걸 빼면 컨테이너 로그가 무한히 자라
# Postgres 볼륨과 같은 디스크를 채운다.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 가 비었다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 비었다}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 가 비었다}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # ⚠️ 이 포트는 compose 내부 통신에 필요하지 않다. 봇·web·migrator 는
      # 서비스명(`postgres:5432`)으로 내부 네트워크를 통해 접속한다.
      # 외부에서 DB 에 붙어야 할 때(예: web 을 Vercel 에서 돌릴 때)만 연다.
      #
      # DB_BIND 기본값은 127.0.0.1 이라 호스트 안에서만 보인다. 인터넷에 열려면
      # .env.prod 에 DB_BIND=0.0.0.0 을 명시해야 한다 — 실수로 열리지 않게
      # 기본을 좁혀 둔 것이고, 열 때는 반드시 아래를 함께 갖출 것.
      #   · 강한 비밀번호(POSTGRES_PASSWORD)
      #   · 접속 문자열에 sslmode=require
      #   · 가능하면 방화벽으로 출처 제한(Vercel 은 egress IP 가 고정이 아니라 불가)
      # 자세한 내용은 docs/ops/deployment.md 의 "web 을 Vercel 에서 돌리기" 참고.
      - '${DB_BIND:-127.0.0.1}:${DB_PORT:-5444}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      # 첫 부팅 때 initdb 가 도는 동안 unhealthy 로 오판하지 않게 한다.
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # appendonly: BullMQ(예약 작업) 큐가 재시작에서 살아남게 한다. 유실되면
    # 예약 작업이 지연될 뿐 복구는 가능하므로 백업 대상은 아니다.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # 일회성 잡. 앱보다 먼저 스키마를 최신으로 올리고 종료한다.
  migrator:
    image: ${IMAGE_REGISTRY:-ghcr.io/filename24}/idle-factory-migrator:${IMAGE_TAG:?IMAGE_TAG 가 비었다}
    # 실패했는데 재시작하면 같은 실패를 반복하며 앱 시작을 영원히 막는다.
    restart: 'no'
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 가 비었다}

  bot:
    image: ${IMAGE_REGISTRY:-ghcr.io/filename24}/idle-factory-bot:${IMAGE_TAG:?IMAGE_TAG 가 비었다}
    restart: unless-stopped
    logging: *default-logging
    # PID 1 이 SIGTERM 을 전달하도록 init 을 붙인다. 없으면 `compose down` 이
    # 매번 10초 타임아웃 후 SIGKILL 로 끝난다.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 마이그레이션이 실패하면 봇은 아예 뜨지 않는다. 스키마와 코드가
      # 어긋난 상태로 돈이 오가는 명령을 처리하는 것보다 낫다.
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 가 비었다}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN 가 비었다}
      BOT_NAME: ${BOT_NAME:-Idle Factory}
      BOT_OWNERS: ${BOT_OWNERS:-}
      BOT_SHARDING: ${BOT_SHARDING:-false}
      BUILD_VERSION: ${BUILD_VERSION:-0.1.4}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
      LOG_LEVEL: ${LOG_LEVEL:-chat}
      LOG_DEV: ${LOG_DEV:-false}
      REPORT_TYPE: ${REPORT_TYPE:-webhook}
      REPORT_WEBHOOK_URL: ${REPORT_WEBHOOK_URL:-}
      ADMIN_AUDIT_WEBHOOK_URL: ${ADMIN_AUDIT_WEBHOOK_URL:-}
      I18N_FALLBACK_LNG: ${I18N_FALLBACK_LNG:-en-US}

  web:
    # web 을 Vercel 로 옮길 수 있게 프로파일로 감싼다. `.env.prod` 의
    # COMPOSE_PROFILES 가 이 값을 포함할 때만 뜬다(템플릿 기본값에 들어 있다).
    # Vercel 로 옮기려면 COMPOSE_PROFILES 를 비우고 WEB_ON_VERCEL=true 로 둔다 —
    # 그러면 배포 워크플로도 web 이미지를 만들지 않고, web 부재를 사고가 아닌
    # 의도로 판정한다. 자세한 절차는 docs/ops/deployment.md 참고.
    profiles: ['self-hosted']
    image: ${IMAGE_REGISTRY:-ghcr.io/filename24}/idle-factory-web:${IMAGE_TAG:?IMAGE_TAG 가 비었다}
    restart: unless-stopped
    logging: *default-logging
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      # 127.0.0.1 바인딩 — 호스트의 기존 리버스 프록시가 이 포트로 붙는다.
      # 0.0.0.0 으로 열면 TLS 없이 인터넷에 그대로 노출된다.
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL 가 비었다}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET 가 비었다}
      # OAuth 콜백 URL 을 이 값으로 조립한다. 실제 도메인이 아니면
      # 로그인 리다이렉트가 localhost 로 튄다.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL 가 비었다}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID 가 비었다}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET 가 비었다}

volumes:
  postgres_data:
  redis_data:
